<svg width="950" height="150" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 150">
  
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0F1D30" stroke-width="1" opacity="0.8"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="grad-title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7B2FFF" />
      <stop offset="100%" stop-color="#FF007F" />
    </linearGradient>
    <linearGradient id="grad-end" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF007F" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#00FF88" />
    </linearGradient>
    <linearGradient id="orbitGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7B2FFF" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .scanline { animation: scan 6s linear infinite; }
    @keyframes scan {
      0% { transform: translateY(-50px); opacity: 0; }
      10% { opacity: 0.5; }
      90% { opacity: 0.5; }
      100% { transform: translateY(600px); opacity: 0; }
    }
    .pulseBeam { stroke-dasharray: 100 900; animation: dash 4s linear infinite; }
    @keyframes dash {
      from { stroke-dashoffset: 1000; }
      to { stroke-dashoffset: 0; }
    }
    .blinkDot { animation: blink 1.5s ease-in-out infinite alternate; }
    @keyframes blink { 0% { opacity: 0.2; } 100% { opacity: 1; } }
    .pulseNode { animation: pulseRadius 2s ease-in-out infinite alternate; }
    @keyframes pulseRadius { 0% { r: 16; } 100% { r: 20; } }
    .titleGlow { animation: drop 3s infinite alternate; }
    @keyframes drop {
      0% { filter: drop-shadow(0px 0px 5px rgba(0,240,255,0.4)); }
      100% { filter: drop-shadow(0px 0px 10px rgba(123,47,255,0.6)); }
    }
  </style>

  <rect width="950" height="150" fill="#050A12" rx="8"/>
  <rect width="950" height="150" fill="url(#grid)" rx="8" opacity="0.6"/>
  
    <!-- Corner Brackets -->
    <path d="M 15 35 L 15 15 L 35 15" fill="none" stroke="#00F0FF" stroke-width="2" filter="url(#glow)"/>
    <path d="M 915 15 L 935 15 L 935 35" fill="none" stroke="#00F0FF" stroke-width="2" filter="url(#glow)"/>
    <path d="M 15 115 L 15 135 L 35 135" fill="none" stroke="#00F0FF" stroke-width="2" filter="url(#glow)"/>
    <path d="M 915 135 L 935 135 L 935 115" fill="none" stroke="#00F0FF" stroke-width="2" filter="url(#glow)"/>
    

  <text x="45" y="30" fill="#00FF88" font-size="12" font-weight="bold">ACTIVITY SIGNAL // COMMIT FREQUENCY &amp; CODE DISPATCH</text>
  <text x="905" y="30" fill="#3D5675" font-size="10" text-anchor="end">SIGNAL_LOCK: 99.8%</text>

  <!-- Activity Histogram Bars -->
  <g transform="translate(45, 50)">
    <!-- Base line -->
    <line x1="0" y1="65" x2="860" y2="65" stroke="#152238" stroke-width="1"/>
    
    <!-- 24 Activity Bars -->
    <rect x="0" y="45" width="18" height="20" fill="#152238" rx="2"/><text x="9" y="80" fill="#3D5675" font-size="8" text-anchor="middle">M1</text>
    <rect x="35" y="35" width="18" height="30" fill="#1b304f" rx="2"/><text x="44" y="80" fill="#3D5675" font-size="8" text-anchor="middle">M2</text>
    <rect x="70" y="20" width="18" height="45" fill="#00F0FF" rx="2" opacity="0.8"/><text x="79" y="80" fill="#3D5675" font-size="8" text-anchor="middle">M3</text>
    <rect x="105" y="10" width="18" height="55" fill="#00F0FF" rx="2" filter="url(#glow)"/><text x="114" y="80" fill="#3D5675" font-size="8" text-anchor="middle">M4</text>
    <rect x="140" y="25" width="18" height="40" fill="#7B2FFF" rx="2"/><text x="149" y="80" fill="#3D5675" font-size="8" text-anchor="middle">M5</text>
    <rect x="175" y="15" width="18" height="50" fill="#7B2FFF" rx="2" filter="url(#glow)"/><text x="184" y="80" fill="#3D5675" font-size="8" text-anchor="middle">M6</text>
    <rect x="210" y="5" width="18" height="60" fill="#00FF88" rx="2" filter="url(#glow)"/><text x="219" y="80" fill="#3D5675" font-size="8" text-anchor="middle">M7</text>
    <rect x="245" y="10" width="18" height="55" fill="#00FF88" rx="2"/><text x="254" y="80" fill="#3D5675" font-size="8" text-anchor="middle">M8</text>
    <rect x="280" y="30" width="18" height="35" fill="#00F0FF" rx="2"/><text x="289" y="80" fill="#3D5675" font-size="8" text-anchor="middle">M9</text>
    <rect x="315" y="15" width="18" height="50" fill="#00F0FF" rx="2"/><text x="324" y="80" fill="#3D5675" font-size="8" text-anchor="middle">M10</text>
    <rect x="350" y="5" width="18" height="60" fill="#FF007F" rx="2" filter="url(#glow)"/><text x="359" y="80" fill="#3D5675" font-size="8" text-anchor="middle">M11</text>
    <rect x="385" y="20" width="18" height="45" fill="#FF007F" rx="2"/><text x="394" y="80" fill="#3D5675" font-size="8" text-anchor="middle">M12</text>
    <rect x="420" y="10" width="18" height="55" fill="#00F0FF" rx="2"/><text x="429" y="80" fill="#3D5675" font-size="8" text-anchor="middle">M13</text>
    <rect x="455" y="5" width="18" height="60" fill="#00FF88" rx="2" filter="url(#glow)"/><text x="464" y="80" fill="#3D5675" font-size="8" text-anchor="middle">M14</text>
    <rect x="490" y="15" width="18" height="50" fill="#7B2FFF" rx="2"/><text x="499" y="80" fill="#3D5675" font-size="8" text-anchor="middle">M15</text>
    <rect x="525" y="25" width="18" height="40" fill="#FFB800" rx="2"/><text x="534" y="80" fill="#3D5675" font-size="8" text-anchor="middle">M16</text>
    <rect x="560" y="8" width="18" height="57" fill="#00F0FF" rx="2" filter="url(#glow)"/><text x="569" y="80" fill="#3D5675" font-size="8" text-anchor="middle">M17</text>
    <rect x="595" y="18" width="18" height="47" fill="#00FF88" rx="2"/><text x="604" y="80" fill="#3D5675" font-size="8" text-anchor="middle">M18</text>
    <rect x="630" y="5" width="18" height="60" fill="#FF007F" rx="2" filter="url(#glow)"/><text x="639" y="80" fill="#3D5675" font-size="8" text-anchor="middle">M19</text>
    <rect x="665" y="12" width="18" height="53" fill="#00F0FF" rx="2"/><text x="674" y="80" fill="#3D5675" font-size="8" text-anchor="middle">M20</text>
    <rect x="700" y="4" width="18" height="61" fill="#00FF88" rx="2" filter="url(#glow)"/><text x="709" y="80" fill="#3D5675" font-size="8" text-anchor="middle">M21</text>
    <rect x="735" y="2" width="18" height="63" fill="#00F0FF" rx="2" filter="url(#glow)"/><text x="744" y="80" fill="#3D5675" font-size="8" text-anchor="middle">M22</text>
    <rect x="770" y="8" width="18" height="57" fill="#7B2FFF" rx="2"/><text x="779" y="80" fill="#3D5675" font-size="8" text-anchor="middle">M23</text>
    <rect x="805" y="3" width="18" height="62" fill="#00FF88" rx="2" filter="url(#glow)"/><text x="814" y="80" fill="#3D5675" font-size="8" text-anchor="middle">NOW</text>
  </g>
</svg>