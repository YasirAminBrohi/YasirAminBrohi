<svg width="950" height="260" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 260">
  
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0F1D30" stroke-width="1" opacity="0.8"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="grad-title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7B2FFF" />
      <stop offset="100%" stop-color="#FF007F" />
    </linearGradient>
    <linearGradient id="grad-end" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF007F" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#00FF88" />
    </linearGradient>
    <linearGradient id="orbitGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7B2FFF" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .scanline { animation: scan 6s linear infinite; }
    @keyframes scan {
      0% { transform: translateY(-50px); opacity: 0; }
      10% { opacity: 0.5; }
      90% { opacity: 0.5; }
      100% { transform: translateY(600px); opacity: 0; }
    }
    .pulseBeam { stroke-dasharray: 100 900; animation: dash 4s linear infinite; }
    @keyframes dash {
      from { stroke-dashoffset: 1000; }
      to { stroke-dashoffset: 0; }
    }
    .blinkDot { animation: blink 1.5s ease-in-out infinite alternate; }
    @keyframes blink { 0% { opacity: 0.2; } 100% { opacity: 1; } }
    .pulseNode { animation: pulseRadius 2s ease-in-out infinite alternate; }
    @keyframes pulseRadius { 0% { r: 16; } 100% { r: 20; } }
    .titleGlow { animation: drop 3s infinite alternate; }
    @keyframes drop {
      0% { filter: drop-shadow(0px 0px 5px rgba(0,240,255,0.4)); }
      100% { filter: drop-shadow(0px 0px 10px rgba(123,47,255,0.6)); }
    }
  </style>

  <rect width="950" height="260" fill="#050A12" rx="8"/>
  <rect width="950" height="260" fill="url(#grid)" rx="8" opacity="0.6"/>
  
    <!-- Corner Brackets -->
    <path d="M 15 35 L 15 15 L 35 15" fill="none" stroke="#00F0FF" stroke-width="2" filter="url(#glow)"/>
    <path d="M 915 15 L 935 15 L 935 35" fill="none" stroke="#00F0FF" stroke-width="2" filter="url(#glow)"/>
    <path d="M 15 225 L 15 245 L 35 245" fill="none" stroke="#00F0FF" stroke-width="2" filter="url(#glow)"/>
    <path d="M 915 245 L 935 245 L 935 225" fill="none" stroke="#00F0FF" stroke-width="2" filter="url(#glow)"/>
    

  <!-- L4 -->
  <g transform="translate(45, 30)">
    <rect width="860" height="40" fill="#0A1628" rx="4"/>
    <rect width="4" height="40" fill="#00F0FF" rx="2"/>
    <text x="20" y="25" fill="#00F0FF" font-size="12" font-weight="bold">L4 // INTERFACE</text>
    <rect x="160" y="8" width="84" height="24" fill="#050A12" rx="12" stroke="#E2E8F0" stroke-width="1"/>
               <text x="202.0" y="24" fill="#E2E8F0" font-size="11" text-anchor="middle">React.js</text>
    <rect x="250" y="8" width="76" height="24" fill="#050A12" rx="12" stroke="#E2E8F0" stroke-width="1"/>
               <text x="288.0" y="24" fill="#E2E8F0" font-size="11" text-anchor="middle">Next.js</text>
    <rect x="330" y="8" width="52" height="24" fill="#050A12" rx="12" stroke="#E2E8F0" stroke-width="1"/>
               <text x="356.0" y="24" fill="#E2E8F0" font-size="11" text-anchor="middle">Vite</text>
    <rect x="390" y="8" width="116" height="24" fill="#050A12" rx="12" stroke="#E2E8F0" stroke-width="1"/>
               <text x="448.0" y="24" fill="#E2E8F0" font-size="11" text-anchor="middle">Tailwind CSS</text>
    <rect x="510" y="8" width="140" height="24" fill="#050A12" rx="12" stroke="#E2E8F0" stroke-width="1"/>
               <text x="580.0" y="24" fill="#E2E8F0" font-size="11" text-anchor="middle">Jetpack Compose</text>
  </g>

  <!-- L3 -->
  <g transform="translate(45, 80)">
    <rect width="860" height="40" fill="#0A1628" rx="4"/>
    <rect width="4" height="40" fill="#7B2FFF" rx="2"/>
    <text x="20" y="25" fill="#7B2FFF" font-size="12" font-weight="bold">L3 // INTERCEPTION</text>
    <rect x="180" y="8" width="100" height="24" fill="#050A12" rx="12" stroke="#E2E8F0" stroke-width="1"/>
               <text x="230.0" y="24" fill="#E2E8F0" font-size="11" text-anchor="middle">Chrome MV3</text>
    <rect x="280" y="8" width="116" height="24" fill="#050A12" rx="12" stroke="#E2E8F0" stroke-width="1"/>
               <text x="338.0" y="24" fill="#E2E8F0" font-size="11" text-anchor="middle">DOM Mutation</text>
    <rect x="390" y="8" width="132" height="24" fill="#050A12" rx="12" stroke="#E2E8F0" stroke-width="1"/>
               <text x="456.0" y="24" fill="#E2E8F0" font-size="11" text-anchor="middle">Protocol Hooks</text>
    <rect x="510" y="8" width="108" height="24" fill="#050A12" rx="12" stroke="#E2E8F0" stroke-width="1"/>
               <text x="564.0" y="24" fill="#E2E8F0" font-size="11" text-anchor="middle">CameraX API</text>
  </g>

  <!-- L2 -->
  <g transform="translate(45, 130)">
    <rect width="860" height="40" fill="#0A1628" rx="4"/>
    <rect width="4" height="40" fill="#00FF88" rx="2"/>
    <text x="20" y="25" fill="#00FF88" font-size="12" font-weight="bold">L2 // SERVICES</text>
    <rect x="150" y="8" width="100" height="24" fill="#050A12" rx="12" stroke="#E2E8F0" stroke-width="1"/>
               <text x="200.0" y="24" fill="#E2E8F0" font-size="11" text-anchor="middle">TypeScript</text>
    <rect x="250" y="8" width="76" height="24" fill="#050A12" rx="12" stroke="#E2E8F0" stroke-width="1"/>
               <text x="288.0" y="24" fill="#E2E8F0" font-size="11" text-anchor="middle">Node.js</text>
    <rect x="330" y="8" width="76" height="24" fill="#050A12" rx="12" stroke="#E2E8F0" stroke-width="1"/>
               <text x="368.0" y="24" fill="#E2E8F0" font-size="11" text-anchor="middle">Express</text>
    <rect x="410" y="8" width="76" height="24" fill="#050A12" rx="12" stroke="#E2E8F0" stroke-width="1"/>
               <text x="448.0" y="24" fill="#E2E8F0" font-size="11" text-anchor="middle">MongoDB</text>
    <rect x="490" y="8" width="100" height="24" fill="#050A12" rx="12" stroke="#E2E8F0" stroke-width="1"/>
               <text x="540.0" y="24" fill="#E2E8F0" font-size="11" text-anchor="middle">REST / JWT</text>
  </g>

  <!-- L1 -->
  <g transform="translate(45, 180)">
    <rect width="860" height="40" fill="#0A1628" rx="4"/>
    <rect width="4" height="40" fill="#FF007F" rx="2"/>
    <text x="20" y="25" fill="#FF007F" font-size="12" font-weight="bold">L1 // RUNTIME</text>
    <rect x="150" y="8" width="36" height="24" fill="#050A12" rx="12" stroke="#E2E8F0" stroke-width="1"/>
               <text x="168.0" y="24" fill="#E2E8F0" font-size="11" text-anchor="middle">Go</text>
    <rect x="190" y="8" width="116" height="24" fill="#050A12" rx="12" stroke="#E2E8F0" stroke-width="1"/>
               <text x="248.0" y="24" fill="#E2E8F0" font-size="11" text-anchor="middle">Rust / Tauri</text>
    <rect x="300" y="8" width="60" height="24" fill="#050A12" rx="12" stroke="#E2E8F0" stroke-width="1"/>
               <text x="330.0" y="24" fill="#E2E8F0" font-size="11" text-anchor="middle">C/C++</text>
    <rect x="370" y="8" width="68" height="24" fill="#050A12" rx="12" stroke="#E2E8F0" stroke-width="1"/>
               <text x="404.0" y="24" fill="#E2E8F0" font-size="11" text-anchor="middle">Kotlin</text>
    <rect x="440" y="8" width="92" height="24" fill="#050A12" rx="12" stroke="#E2E8F0" stroke-width="1"/>
               <text x="486.0" y="24" fill="#E2E8F0" font-size="11" text-anchor="middle">Win32 API</text>
  </g>
</svg>