<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 280" width="100%" height="100%">
  <defs>
    <linearGradient id="tmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="100%" stop-color="#09101d"/>
    </linearGradient>
    <style>
      .mono { font-family: 'Fira Code', monospace; }
      .layer-title { font-weight: 800; font-size: 11px; letter-spacing: 1.5px; }
      .pill-text { font-size: 10px; font-weight: 600; }
    </style>
  </defs>

  <rect width="950" height="280" rx="8" fill="url(#tmBg)" stroke="#152136" stroke-width="1.2"/>

  <!-- Layer 04: UI & Interaction -->
  <g transform="translate(25, 20)">
    <rect width="900" height="52" rx="5" fill="#0b1424" stroke="#00F0FF" stroke-width="1"/>
    <text x="20" y="31" class="mono layer-title" fill="#00F0FF">L4 // USERLAND &amp; INTERFACE</text>
    <!-- Pills -->
    <g transform="translate(300, 14)">
      <rect x="0" width="100" height="24" rx="4" fill="#12233c"/><text x="50" y="16" fill="#61DAFB" text-anchor="middle" class="mono pill-text">React.js</text>
      <rect x="110" width="85" height="24" rx="4" fill="#12233c"/><text x="152" y="16" fill="#FFFFFF" text-anchor="middle" class="mono pill-text">Next.js</text>
      <rect x="205" width="75" height="24" rx="4" fill="#12233c"/><text x="242" y="16" fill="#646CFF" text-anchor="middle" class="mono pill-text">Vite</text>
      <rect x="290" width="120" height="24" rx="4" fill="#12233c"/><text x="350" y="16" fill="#38BDF8" text-anchor="middle" class="mono pill-text">Tailwind CSS</text>
      <rect x="420" width="150" height="24" rx="4" fill="#12233c"/><text x="495" y="16" fill="#4285F4" text-anchor="middle" class="mono pill-text">Jetpack Compose</text>
    </g>
  </g>

  <!-- Layer 03: Protocol Hooks & Extension Engine -->
  <g transform="translate(25, 82)">
    <rect width="900" height="52" rx="5" fill="#0b1424" stroke="#7000FF" stroke-width="1"/>
    <text x="20" y="31" class="mono layer-title" fill="#A855F7">L3 // PROTOCOL &amp; INTERCEPTION</text>
    <g transform="translate(300, 14)">
      <rect x="0" width="155" height="24" rx="4" fill="#1d1538"/><text x="77" y="16" fill="#C084FC" text-anchor="middle" class="mono pill-text">Chrome MV3 Core</text>
      <rect x="165" width="150" height="24" rx="4" fill="#1d1538"/><text x="240" y="16" fill="#C084FC" text-anchor="middle" class="mono pill-text">DOM Mutation Pipeline</text>
      <rect x="325" width="135" height="24" rx="4" fill="#1d1538"/><text x="392" y="16" fill="#C084FC" text-anchor="middle" class="mono pill-text">Signal/WWeb Hooks</text>
      <rect x="470" width="105" height="24" rx="4" fill="#1d1538"/><text x="522" y="16" fill="#C084FC" text-anchor="middle" class="mono pill-text">CameraX API</text>
    </g>
  </g>

  <!-- Layer 02: Full-Stack & Data Services -->
  <g transform="translate(25, 144)">
    <rect width="900" height="52" rx="5" fill="#0b1424" stroke="#00FF88" stroke-width="1"/>
    <text x="20" y="31" class="mono layer-title" fill="#00FF88">L2 // DISTRIBUTED SERVICES</text>
    <g transform="translate(300, 14)">
      <rect x="0" width="110" height="24" rx="4" fill="#0e261d"/><text x="55" y="16" fill="#4ADE80" text-anchor="middle" class="mono pill-text">TypeScript</text>
      <rect x="120" width="95" height="24" rx="4" fill="#0e261d"/><text x="167" y="16" fill="#4ADE80" text-anchor="middle" class="mono pill-text">Node.js</text>
      <rect x="225" width="95" height="24" rx="4" fill="#0e261d"/><text x="272" y="16" fill="#4ADE80" text-anchor="middle" class="mono pill-text">Express</text>
      <rect x="330" width="105" height="24" rx="4" fill="#0e261d"/><text x="382" y="16" fill="#4ADE80" text-anchor="middle" class="mono pill-text">MongoDB</text>
      <rect x="445" width="130" height="24" rx="4" fill="#0e261d"/><text x="510" y="16" fill="#4ADE80" text-anchor="middle" class="mono pill-text">REST / JWT Auth</text>
    </g>
  </g>

  <!-- Layer 01: Low-Level Runtimes & Systems -->
  <g transform="translate(25, 206)">
    <rect width="900" height="52" rx="5" fill="#0b1424" stroke="#FF007F" stroke-width="1"/>
    <text x="20" y="31" class="mono layer-title" fill="#FF007F">L1 // SYSTEMS &amp; LOW-LEVEL</text>
    <g transform="translate(300, 14)">
      <rect x="0" width="90" height="24" rx="4" fill="#301121"/><text x="45" y="16" fill="#F472B6" text-anchor="middle" class="mono pill-text">Go (Golang)</text>
      <rect x="100" width="115" height="24" rx="4" fill="#301121"/><text x="157" y="16" fill="#F472B6" text-anchor="middle" class="mono pill-text">Rust / Tauri</text>
      <rect x="225" width="85" height="24" rx="4" fill="#301121"/><text x="267" y="16" fill="#F472B6" text-anchor="middle" class="mono pill-text">C / C++</text>
      <rect x="320" width="85" height="24" rx="4" fill="#301121"/><text x="362" y="16" fill="#F472B6" text-anchor="middle" class="mono pill-text">Kotlin</text>
      <rect x="415" width="160" height="24" rx="4" fill="#301121"/><text x="495" y="16" fill="#F472B6" text-anchor="middle" class="mono pill-text">Win32 API / Linux PTY</text>
    </g>
  </g>
</svg>