<svg width="950" height="160" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 160">
  
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0F1D30" stroke-width="1" opacity="0.8"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="grad-title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7B2FFF" />
      <stop offset="100%" stop-color="#FF007F" />
    </linearGradient>
    <linearGradient id="grad-end" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF007F" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#00FF88" />
    </linearGradient>
    <linearGradient id="orbitGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7B2FFF" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .scanline { animation: scan 6s linear infinite; }
    @keyframes scan {
      0% { transform: translateY(-50px); opacity: 0; }
      10% { opacity: 0.5; }
      90% { opacity: 0.5; }
      100% { transform: translateY(600px); opacity: 0; }
    }
    .pulseBeam { stroke-dasharray: 100 900; animation: dash 4s linear infinite; }
    @keyframes dash {
      from { stroke-dashoffset: 1000; }
      to { stroke-dashoffset: 0; }
    }
    .blinkDot { animation: blink 1.5s ease-in-out infinite alternate; }
    @keyframes blink { 0% { opacity: 0.2; } 100% { opacity: 1; } }
    .pulseNode { animation: pulseRadius 2s ease-in-out infinite alternate; }
    @keyframes pulseRadius { 0% { r: 16; } 100% { r: 20; } }
    .titleGlow { animation: drop 3s infinite alternate; }
    @keyframes drop {
      0% { filter: drop-shadow(0px 0px 5px rgba(0,240,255,0.4)); }
      100% { filter: drop-shadow(0px 0px 10px rgba(123,47,255,0.6)); }
    }
  </style>

  <rect width="950" height="160" fill="#0A1628" rx="8" stroke="#152238" stroke-width="1"/>
  <rect width="950" height="160" fill="url(#grid)" rx="8" opacity="0.5"/>
  
    <!-- Corner Brackets -->
    <path d="M 15 35 L 15 15 L 35 15" fill="none" stroke="#00F0FF" stroke-width="2" filter="url(#glow)"/>
    <path d="M 915 15 L 935 15 L 935 35" fill="none" stroke="#00F0FF" stroke-width="2" filter="url(#glow)"/>
    <path d="M 15 125 L 15 145 L 35 145" fill="none" stroke="#00F0FF" stroke-width="2" filter="url(#glow)"/>
    <path d="M 915 145 L 935 145 L 935 125" fill="none" stroke="#00F0FF" stroke-width="2" filter="url(#glow)"/>
    
  
  <g transform="translate(45, 30)">
    <rect width="240" height="100" fill="#050A12" rx="6" stroke="#FF007F" stroke-width="1"/>
    <text x="120" y="25" fill="#FF007F" font-size="12" font-weight="bold" text-anchor="middle">GRAPH &amp; MEDIA CLIENT</text>
    <circle cx="15" cy="50" r="3" fill="#7E9EB8"/><text x="25" y="54" fill="#E2E8F0" font-size="10">React &amp; Vite Interface</text>
    <circle cx="15" cy="70" r="3" fill="#7E9EB8"/><text x="25" y="74" fill="#E2E8F0" font-size="10">Interactive Floor Maps</text>
    <circle cx="15" cy="90" r="3" fill="#7E9EB8"/><text x="25" y="94" fill="#E2E8F0" font-size="10">Glassmorphism UI</text>

    <path class="pulseBeam" d="M 250 50 L 310 50" fill="none" stroke="#7B2FFF" stroke-width="2" stroke-dasharray="10 5"/>
    <polygon points="310,47 316,50 310,53" fill="#7B2FFF"/>

    <rect x="320" y="0" width="240" height="100" fill="#050A12" rx="6" stroke="#7B2FFF" stroke-width="1"/>
    <text x="440" y="25" fill="#7B2FFF" font-size="12" font-weight="bold" text-anchor="middle">ROUTING &amp; PARSER CORE</text>
    <circle cx="335" cy="50" r="3" fill="#7E9EB8"/><text x="345" y="54" fill="#E2E8F0" font-size="10">FAST Seating Algorithms</text>
    <circle cx="335" cy="70" r="3" fill="#7E9EB8"/><text x="345" y="74" fill="#E2E8F0" font-size="10">Peer Proximity Queries</text>
    <circle cx="335" cy="90" r="3" fill="#7E9EB8"/><text x="345" y="94" fill="#E2E8F0" font-size="10">Media Stream Extraction</text>

    <path class="pulseBeam" d="M 570 50 L 630 50" fill="none" stroke="#00FF88" stroke-width="2" stroke-dasharray="10 5"/>
    <polygon points="630,47 636,50 630,53" fill="#00FF88"/>

    <rect x="640" y="0" width="220" height="100" fill="#050A12" rx="6" stroke="#00FF88" stroke-width="1"/>
    <text x="750" y="25" fill="#00FF88" font-size="12" font-weight="bold" text-anchor="middle">BACKEND SERVICES</text>
    <circle cx="655" cy="50" r="3" fill="#7E9EB8"/><text x="665" y="54" fill="#E2E8F0" font-size="10">Node / Express Endpoints</text>
    <circle cx="655" cy="70" r="3" fill="#7E9EB8"/><text x="665" y="74" fill="#E2E8F0" font-size="10">JWT Authenticated Storage</text>
    <circle cx="655" cy="90" r="3" fill="#7E9EB8"/><text x="665" y="94" fill="#E2E8F0" font-size="10">MongoDB Note Engine</text>
  </g>
</svg>