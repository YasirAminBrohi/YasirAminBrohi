<svg width="950" height="200" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 200">
  
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0F1D30" stroke-width="1" opacity="0.8"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="grad-title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7B2FFF" />
      <stop offset="100%" stop-color="#FF007F" />
    </linearGradient>
    <linearGradient id="grad-end" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF007F" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#00FF88" />
    </linearGradient>
    <linearGradient id="orbitGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7B2FFF" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .scanline { animation: scan 6s linear infinite; }
    @keyframes scan {
      0% { transform: translateY(-50px); opacity: 0; }
      10% { opacity: 0.5; }
      90% { opacity: 0.5; }
      100% { transform: translateY(600px); opacity: 0; }
    }
    .pulseBeam { stroke-dasharray: 100 900; animation: dash 4s linear infinite; }
    @keyframes dash {
      from { stroke-dashoffset: 1000; }
      to { stroke-dashoffset: 0; }
    }
    .blinkDot { animation: blink 1.5s ease-in-out infinite alternate; }
    @keyframes blink { 0% { opacity: 0.2; } 100% { opacity: 1; } }
    .pulseNode { animation: pulseRadius 2s ease-in-out infinite alternate; }
    @keyframes pulseRadius { 0% { r: 16; } 100% { r: 20; } }
    .titleGlow { animation: drop 3s infinite alternate; }
    @keyframes drop {
      0% { filter: drop-shadow(0px 0px 5px rgba(0,240,255,0.4)); }
      100% { filter: drop-shadow(0px 0px 10px rgba(123,47,255,0.6)); }
    }
  </style>

  <rect width="950" height="200" fill="#0A1628" rx="8" stroke="#152238" stroke-width="2"/>
  <rect width="950" height="200" fill="url(#grid)" rx="8" opacity="0.8"/>
  
    <!-- Corner Brackets -->
    <path d="M 15 35 L 15 15 L 35 15" fill="none" stroke="#00F0FF" stroke-width="2" filter="url(#glow)"/>
    <path d="M 915 15 L 935 15 L 935 35" fill="none" stroke="#00F0FF" stroke-width="2" filter="url(#glow)"/>
    <path d="M 15 165 L 15 185 L 35 185" fill="none" stroke="#00F0FF" stroke-width="2" filter="url(#glow)"/>
    <path d="M 915 185 L 935 185 L 935 165" fill="none" stroke="#00F0FF" stroke-width="2" filter="url(#glow)"/>
    

  <text x="45" y="45" fill="#00F0FF" font-size="15" font-weight="bold">OPERATOR // IDENTITY MANIFEST</text>
  <path d="M 45 55 L 450 55" fill="none" stroke="#152238" stroke-width="1"/>
  
  <text x="45" y="85" fill="#3D5675" font-size="12">HANDLE:</text>
  <text x="130" y="85" fill="#E2E8F0" font-size="13" font-weight="bold">YasirAminBrohi</text>
  
  <text x="45" y="115" fill="#3D5675" font-size="12">BASE:</text>
  <text x="130" y="115" fill="#E2E8F0" font-size="13">FAST-NUCES Karachi Campus (BSCS) 🇵🇰</text>

  <text x="45" y="145" fill="#3D5675" font-size="12">REGION:</text>
  <text x="130" y="145" fill="#E2E8F0" font-size="13">Sindh, Pakistan [24.86° N, 67.00° E]</text>
  
  <text x="45" y="175" fill="#3D5675" font-size="12">FOCUS:</text>
  <text x="130" y="175" fill="#00FF88" font-size="13">Protocol Interception • Extension Engines • Android Systems</text>

  <path d="M 550 20 L 550 180" fill="none" stroke="#152238" stroke-width="1"/>
  <text x="580" y="45" fill="#00F0FF" font-size="14" font-weight="bold">ENGINEERING DOMAINS</text>
  
  <text x="580" y="75" fill="#7E9EB8" font-size="11">BROWSER INTERCEPTION</text>
  <rect x="750" y="67" width="120" height="8" fill="#00F0FF" rx="2"/><rect x="872" y="67" width="30" height="8" fill="#152238" rx="2"/>
  
  <text x="580" y="100" fill="#7E9EB8" font-size="11">ANDROID SYSTEMS</text>
  <rect x="750" y="92" width="105" height="8" fill="#00FF88" rx="2"/><rect x="857" y="92" width="45" height="8" fill="#152238" rx="2"/>
  
  <text x="580" y="125" fill="#7E9EB8" font-size="11">DISTRIBUTED WEB</text>
  <rect x="750" y="117" width="115" height="8" fill="#7B2FFF" rx="2"/><rect x="867" y="117" width="35" height="8" fill="#152238" rx="2"/>
  
  <text x="580" y="150" fill="#7E9EB8" font-size="11">SYSTEMS / CLI</text>
  <rect x="750" y="142" width="95" height="8" fill="#FFB800" rx="2"/><rect x="847" y="142" width="55" height="8" fill="#152238" rx="2"/>
  
  <text x="580" y="175" fill="#7E9EB8" font-size="11">ALGORITHMS / C</text>
  <rect x="750" y="167" width="85" height="8" fill="#FF007F" rx="2"/><rect x="837" y="167" width="65" height="8" fill="#152238" rx="2"/>
</svg>