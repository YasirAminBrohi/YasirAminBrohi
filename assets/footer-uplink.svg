<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 140" width="100%" height="100%">
  <defs>
    <linearGradient id="fBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080e"/>
      <stop offset="100%" stop-color="#090f1a"/>
    </linearGradient>
    <linearGradient id="fLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF007F"/>
      <stop offset="50%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#00FF88"/>
    </linearGradient>
    <style>
      .mono { font-family: 'Fira Code', monospace; }
      @keyframes blinkCursor { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .cursor { animation: blinkCursor 1s step-end infinite; }
    </style>
  </defs>

  <rect width="950" height="140" rx="10" fill="url(#fBg)" stroke="#142033" stroke-width="1.2"/>
  <path d="M 30 20 L 920 20" stroke="url(#fLine)" stroke-width="2"/>

  <g transform="translate(475, 60)" text-anchor="middle">
    <text class="mono" font-size="14" font-weight="700" fill="#00F0FF" letter-spacing="2">
      // TRANSMISSION TERMINAL: STANDBY FOR COMMANDS
    </text>
    <text y="30" class="mono" font-size="11" fill="#6B88A6" letter-spacing="1">
      STATUS: LISTENING ON PORT 443 <tspan fill="#00FF88" class="cursor">█</tspan>
    </text>
  </g>

  <g class="mono" font-size="9" fill="#3A526E">
    <text x="30" y="120">HASH: 0x7F_YASIR_BROHI_NUCES</text>
    <text x="750" y="120">DISTRIBUTED BY GITHUB ENGINE</text>
  </g>
</svg>