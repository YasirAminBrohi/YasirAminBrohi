<svg width="950" height="340" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 340">
  
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0F1D30" stroke-width="1" opacity="0.8"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="grad-title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7B2FFF" />
      <stop offset="100%" stop-color="#FF007F" />
    </linearGradient>
    <linearGradient id="grad-end" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF007F" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#00FF88" />
    </linearGradient>
    <linearGradient id="orbitGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7B2FFF" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .scanline { animation: scan 6s linear infinite; }
    @keyframes scan {
      0% { transform: translateY(-50px); opacity: 0; }
      10% { opacity: 0.5; }
      90% { opacity: 0.5; }
      100% { transform: translateY(600px); opacity: 0; }
    }
    .pulseBeam { stroke-dasharray: 100 900; animation: dash 4s linear infinite; }
    @keyframes dash {
      from { stroke-dashoffset: 1000; }
      to { stroke-dashoffset: 0; }
    }
    .blinkDot { animation: blink 1.5s ease-in-out infinite alternate; }
    @keyframes blink { 0% { opacity: 0.2; } 100% { opacity: 1; } }
    .pulseNode { animation: pulseRadius 2s ease-in-out infinite alternate; }
    @keyframes pulseRadius { 0% { r: 16; } 100% { r: 20; } }
    .titleGlow { animation: drop 3s infinite alternate; }
    @keyframes drop {
      0% { filter: drop-shadow(0px 0px 5px rgba(0,240,255,0.4)); }
      100% { filter: drop-shadow(0px 0px 10px rgba(123,47,255,0.6)); }
    }
  </style>

  <rect width="950" height="340" fill="#050A12" rx="8"/>
  <rect width="950" height="340" fill="url(#grid)" rx="8" opacity="0.5"/>
  
    <!-- Corner Brackets -->
    <path d="M 15 35 L 15 15 L 35 15" fill="none" stroke="#00F0FF" stroke-width="2" filter="url(#glow)"/>
    <path d="M 915 15 L 935 15 L 935 35" fill="none" stroke="#00F0FF" stroke-width="2" filter="url(#glow)"/>
    <path d="M 15 305 L 15 325 L 35 325" fill="none" stroke="#00F0FF" stroke-width="2" filter="url(#glow)"/>
    <path d="M 915 325 L 935 325 L 935 305" fill="none" stroke="#00F0FF" stroke-width="2" filter="url(#glow)"/>
    

  <text x="45" y="35" fill="#00F0FF" font-size="14" font-weight="bold">TECHNOLOGY CONSTELLATION // ORBITAL MATRIX</text>
  <text x="905" y="35" fill="#3D5675" font-size="10" text-anchor="end">RADAR_SYS: 0x7F_ACTIVE</text>

  <!-- Orbital Rings -->
  <g transform="translate(475, 180)">
    <circle cx="0" cy="0" r="140" fill="none" stroke="#152238" stroke-width="1.5" stroke-dasharray="6 6"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#1c2d47" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#253a5c" stroke-width="1.5" stroke-dasharray="4 4"/>
    
    <!-- Center Core -->
    <circle cx="0" cy="0" r="24" fill="#0A1628" stroke="#7B2FFF" stroke-width="2" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="8" fill="#00F0FF"/>
    <text y="4" fill="#FFFFFF" font-size="9" font-weight="bold" text-anchor="middle">CORE</text>

    <!-- Orbit Nodes - Inner Ring (Languages) -->
    <!-- TypeScript -->
    <g transform="translate(-45, -40)"><circle cx="0" cy="0" r="14" fill="#050A12" stroke="#00F0FF" stroke-width="1.5"/><text y="4" fill="#00F0FF" font-size="8" font-weight="bold" text-anchor="middle">TS</text></g>
    <!-- Kotlin -->
    <g transform="translate(45, -40)"><circle cx="0" cy="0" r="14" fill="#050A12" stroke="#00FF88" stroke-width="1.5"/><text y="4" fill="#00FF88" font-size="8" font-weight="bold" text-anchor="middle">KT</text></g>
    <!-- Go -->
    <g transform="translate(55, 30)"><circle cx="0" cy="0" r="14" fill="#050A12" stroke="#FFB800" stroke-width="1.5"/><text y="4" fill="#FFB800" font-size="8" font-weight="bold" text-anchor="middle">GO</text></g>
    <!-- Rust -->
    <g transform="translate(-55, 30)"><circle cx="0" cy="0" r="14" fill="#050A12" stroke="#FF007F" stroke-width="1.5"/><text y="4" fill="#FF007F" font-size="8" font-weight="bold" text-anchor="middle">RS</text></g>

    <!-- Orbit Nodes - Middle Ring (Runtimes & Frameworks) -->
    <!-- React -->
    <g transform="translate(-95, -35)"><circle cx="0" cy="0" r="16" fill="#050A12" stroke="#00F0FF" stroke-width="1.5"/><text y="4" fill="#61DAFB" font-size="8" font-weight="bold" text-anchor="middle">React</text></g>
    <!-- Jetpack Compose -->
    <g transform="translate(95, -35)"><circle cx="0" cy="0" r="16" fill="#050A12" stroke="#00FF88" stroke-width="1.5"/><text y="4" fill="#00FF88" font-size="8" font-weight="bold" text-anchor="middle">Compose</text></g>
    <!-- Chrome MV3 -->
    <g transform="translate(0, -98)"><circle cx="0" cy="0" r="16" fill="#050A12" stroke="#7B2FFF" stroke-width="1.5"/><text y="4" fill="#C084FC" font-size="8" font-weight="bold" text-anchor="middle">MV3</text></g>
    <!-- Node.js -->
    <g transform="translate(0, 98)"><circle cx="0" cy="0" r="16" fill="#050A12" stroke="#00FF88" stroke-width="1.5"/><text y="4" fill="#4ADE80" font-size="8" font-weight="bold" text-anchor="middle">Node</text></g>
    <!-- Tauri -->
    <g transform="translate(-85, 60)"><circle cx="0" cy="0" r="16" fill="#050A12" stroke="#FFB800" stroke-width="1.5"/><text y="4" fill="#FFB800" font-size="8" font-weight="bold" text-anchor="middle">Tauri</text></g>
    <!-- C/C++ -->
    <g transform="translate(85, 60)"><circle cx="0" cy="0" r="16" fill="#050A12" stroke="#FF007F" stroke-width="1.5"/><text y="4" fill="#F472B6" font-size="8" font-weight="bold" text-anchor="middle">C++</text></g>

    <!-- Outer Ring Nodes (Infrastructure & Data) -->
    <!-- Tailwind -->
    <g transform="translate(-135, -45)"><circle cx="0" cy="0" r="13" fill="#050A12" stroke="#38BDF8" stroke-width="1"/><text y="3" fill="#38BDF8" font-size="7" text-anchor="middle">Tailwind</text></g>
    <!-- CameraX -->
    <g transform="translate(135, -45)"><circle cx="0" cy="0" r="13" fill="#050A12" stroke="#00FF88" stroke-width="1"/><text y="3" fill="#00FF88" font-size="7" text-anchor="middle">CameraX</text></g>
    <!-- MongoDB -->
    <g transform="translate(135, 45)"><circle cx="0" cy="0" r="13" fill="#050A12" stroke="#4ADE80" stroke-width="1"/><text y="3" fill="#4ADE80" font-size="7" text-anchor="middle">Mongo</text></g>
    <!-- Win32 PTY -->
    <g transform="translate(-135, 45)"><circle cx="0" cy="0" r="13" fill="#050A12" stroke="#FFB800" stroke-width="1"/><text y="3" fill="#FFB800" font-size="7" text-anchor="middle">Win32</text></g>
  </g>
</svg>